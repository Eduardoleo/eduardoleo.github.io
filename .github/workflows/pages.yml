# Compila, prueba y publica el sitio en GitHub Pages en cada push a main.
# Actions fijadas por SHA de commit (la etiqueta va en el comentario).
# Requiere Settings > Pages > Source = "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo por defecto; solo el job de despliegue recibe permisos de Pages.
permissions:
  contents: read

# Un despliegue a la vez; no cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Dependencias (lockfile exacto)
        run: npm ci

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Navegador para las pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas Playwright + axe (incluye el build)
        run: npm test
        env:
          CI: "true"

      - name: Build limpio para publicar
        run: npm run build

      - name: Comprobar archivos clave
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/.well-known/security.txt
          test -f dist/cv/eduardo-leon-hernandez-cv-es.pdf
          test -f dist/cv/eduardo-leon-hernandez-cv-en.pdf

      - name: Subir el artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Sin esto se omite .well-known/security.txt.
          include-hidden-files: true

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
